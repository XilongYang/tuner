name: Test

on:
  push:
    branches: [main, rewrite]
  pull_request:

jobs:
  unit:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Includes tests/arch.test.mjs, which enforces the dependency direction
      # and purity rules in docs/ARCHITECTURE.md -- a violation fails CI rather
      # than waiting to be noticed in review.
      - run: npm test
