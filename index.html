<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tuner</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/controls.css">
  <link rel="stylesheet" href="css/practice.css">
  <link rel="stylesheet" href="css/panels.css">
</head>
<body>
  <!-- One shell holds the masthead, the practice column and the panels, so the
       header's own controls line up with the column beneath them rather than
       with the far edges of the screen. An open panel widens the shell, and
       everything in it moves together. -->
  <div class="shell">
    <header class="app-header">
      <div class="app-bar">
        <label class="global-toggle" for="hide-all">
          <input type="checkbox" id="hide-all">
          <span>Hide text</span>
        </label>
        <nav class="app-nav">
          <!-- Sync is the one thing here that happens without being asked, so
               it gets somewhere permanent to say so. Hidden until a container
               is configured; filled in by ui/sync-indicator.js. -->
          <div class="sync-indicator" id="sync-indicator" hidden></div>
          <!-- One button for the one sidebar. What is in it -- sessions,
               vocabulary, settings -- is chosen inside it, so the header does
               not have to grow a button per list. -->
          <button type="button" class="btn icon-btn" id="toggle-sidebar" aria-expanded="false" aria-controls="sidebar" title="Panel" aria-label="Panel">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <rect x="3.25" y="4.25" width="17.5" height="15.5" rx="3.25"></rect>
              <line x1="9.5" y1="4.25" x2="9.5" y2="19.75"></line>
            </svg>
          </button>
        </nav>
      </div>
      <h1 class="app-title">Tuner</h1>
    </header>

    <div class="columns">
      <main class="app-main">
        <!-- The practice panel builds itself in here. -->
        <section class="practice" id="practice" aria-label="Practice"></section>
      </main>

      <!-- One sidebar, with the tab row above its views. Each view builds
           itself into its own container and says nothing about the others. -->
      <aside class="sidebar" id="sidebar" hidden aria-label="Panel">
        <!-- The scrolling happens one box in, so the rule drawn on the aside
             stays where it is while the list under it scrolls. -->
        <div class="sidebar-scroll">
          <div class="panel-tabs" id="sidebar-tabs" role="tablist"></div>
          <div class="panel-view" id="library" hidden></div>
          <div class="panel-view" id="settings" hidden></div>
        </div>
      </aside>
    </div>
  </div>

  <p class="app-status" id="app-status" role="status" hidden></p>

  <script type="module" src="js/main.js"></script>
</body>
</html>
