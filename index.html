<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tuner</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/controls.css">
  <link rel="stylesheet" href="css/practice.css">
  <link rel="stylesheet" href="css/panels.css">
</head>
<body>
  <!-- One shell holds the masthead, the practice column and the panels, so the
       header's own controls line up with the column beneath them rather than
       with the far edges of the screen. An open panel widens the shell, and
       everything in it moves together. -->
  <div class="shell">
    <header class="app-header">
      <label class="global-toggle" for="hide-all">
        <input type="checkbox" id="hide-all">
        <span>Hide text</span>
      </label>
      <h1 class="app-title">Tuner</h1>
      <nav class="app-nav">
        <button type="button" class="btn" id="toggle-library" aria-expanded="false">Library</button>
        <button type="button" class="btn" id="toggle-settings" aria-expanded="false">Settings</button>
      </nav>
    </header>

    <div class="columns">
      <main class="app-main">
        <!-- The practice panel builds itself in here. -->
        <section class="practice" id="practice" aria-label="Practice"></section>
      </main>

      <aside class="sidebar" id="library" hidden aria-label="Library"></aside>
      <aside class="sidebar" id="settings" hidden aria-label="Settings"></aside>
    </div>
  </div>

  <p class="app-status" id="app-status" role="status" hidden></p>

  <script type="module" src="js/main.js"></script>
</body>
</html>
